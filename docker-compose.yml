# Local development stack:
#   warehouse   Postgres that holds the flight data (localhost:5432)
#   airflow-db  Postgres for Airflow's own metadata
#   airflow     Airflow in standalone mode, UI at http://localhost:8080
#
# Start with: docker compose up -d --build

x-warehouse-env: &warehouse-env
  POSTGRES_USER: ${WAREHOUSE_USER:-flights}
  POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-flights}
  POSTGRES_DB: ${WAREHOUSE_DB:-flights}

services:
  warehouse:
    image: postgres:18-alpine
    environment: *warehouse-env
    ports:
      - "5432:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build: .
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local dev only: skip the login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-change-me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-only-change-me}
      PYTHONPATH: /opt/airflow
      OUTPUT_DIR: /opt/airflow/data/raw
      WAREHOUSE_URL: postgresql://${WAREHOUSE_USER:-flights}:${WAREHOUSE_PASSWORD:-flights}@warehouse:5432/${WAREHOUSE_DB:-flights}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./extract:/opt/airflow/extract
      - ./load:/opt/airflow/load
      - ./data:/opt/airflow/data
    depends_on:
      warehouse:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  warehouse-data:
  airflow-db-data:
