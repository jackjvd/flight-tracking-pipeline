version: 2

sources:
  - name: raw
    description: Tables written by the Python loader (load/loader.py).
    schema: raw
    tables:
      - name: flight_states
        description: One row per aircraft per OpenSky snapshot, exactly as extracted.
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
      - name: loaded_files
        description: Bookkeeping of which raw files have been loaded.
