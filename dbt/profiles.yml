# Connection settings come from the same WAREHOUSE_* variables as docker compose.
# Inside the Airflow container WAREHOUSE_HOST is "warehouse"; locally it defaults to localhost.
flights:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER', 'flights') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'flights') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'flights') }}"
      schema: analytics
      threads: 4
